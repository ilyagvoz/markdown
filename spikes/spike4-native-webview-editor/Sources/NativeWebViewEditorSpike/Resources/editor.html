<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidate A Native WebView Editor Spike</title>
    <link rel="stylesheet" href="./editor.css">
  </head>
  <body>
    <main class="shell native-shell">
      <section class="editor-pane">
        <h1>Native WebView Editor</h1>
        <p class="caption">
          Edit the rendered text directly. Ordinary edits preserve Markdown presentation markers; Left Arrow at the beginning of a block unlocks the raw marker.
        </p>
        <div class="editor" data-editor aria-label="Markdown live preview editor"></div>
        <p class="status" data-status>Loading bridge...</p>
      </section>
    </main>
    <script defer src="./editor-bundle.js"></script>
  </body>
</html>
